[SYSTEM]
case_name = cavity
x_min = 0.0
x_max = 1.0
y_min = 0.0
y_max = 1.0
Nx = 41
Ny = 41
fict_x = 1
fict_y = 1

; Общие параметры времени (для нестационарных методов)
tmax = 15.0
dt = 0.01
step_num = 50                ; частота сохранения кадров

; Параметры несжимаемой жидкости
Re = 100
U_lid = 1.0
rho = 1.0                    ; плотность (условная)

; Параметры метода (выберите equation_type)
equation_type = 10            ; 8 = SIMPLE, 9 = PISO, 10 = PIMPLE

; SIMPLE
alpha_u = 0.7
alpha_p = 0.3
max_iter_simple = 5000
tol_simple = 1e-6

; PISO
n_correctors = 2

; PIMPLE
nOuterCorr = 3
nCorrectors = 1

; Граничные условия (1 = стенка, 2 = выход/симметрия/движущаяся)
boundary_type_left = 1
boundary_type_right = 1
boundary_type_up   = 2
boundary_type_down = 1

; Параметры вывода
step_out = 5
px = 1
py = 1

; Сжимаемые параметры (не используются, оставлены для совместимости)
cfl = 0.5
g = 1.4

[INITIAL_CONDITIONS]
; Один блок на всю область с нулевыми начальными условиями
x_blocks_number = 1
y_blocks_number = 1

BLOCK_11
x_begin = 0
x_end = 40
y_begin = 0
y_end = 40
density = 1.0
velocity_u = 0.0
velocity_v = 0.0
pressure = 0.0